app = "jubitmind-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_DEMO_MODE = "true"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DEMO_MODE = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
