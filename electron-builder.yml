appId: ai.jubit.jubitmind
productName: JubitMind
copyright: Copyright © 2026 Jubit.ai

directories:
  buildResources: build
  output: dist-electron

files:
  - dist/**/*
  - dist-electron-ts/**/*.js
  - electron/splash.html
  - package.json
  - providers.json
  - node_modules/**/*
  # Sidecar Python source (dev/fallback — used if binary not present)
  - sidecar/main.py
  - sidecar/schemas.py
  - sidecar/requirements.txt

# Bundle pre-built sidecar binary alongside the app (if built)
extraResources:
  - from: "sidecar/dist/sidecar/"
    to: "sidecar"
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  # x64ArchFiles for universal builds (when sidecar binaries are present):
  # x64ArchFiles: "Contents/Resources/sidecar/**/*"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
