<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JubitMind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
    user-select: none;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(20, 184, 166, 0.25);
  }
  .logo svg {
    width: 36px;
    height: 36px;
    color: white;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 32px;
  }
  .progress-container {
    width: 180px;
    height: 3px;
    background: #21262d;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-bar {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #14b8a6, #0d9488);
    border-radius: 2px;
    animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  .status {
    font-size: 12px;
    color: #8b949e;
  }
  .error {
    color: #f85149;
    display: none;
    font-size: 13px;
    max-width: 300px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
  </div>
  <h1>JubitMind</h1>
  <p class="subtitle">AI Interaction Audit</p>
  <div class="progress-container">
    <div class="progress-bar"></div>
  </div>
  <p class="status" id="status">Starting server...</p>
  <p class="error" id="error"></p>
</body>
</html>
